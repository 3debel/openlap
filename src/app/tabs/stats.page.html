<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{'Statistics' | translate}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{'Statistics' | translate}}</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="empty-state">
    <ion-icon name="stats-chart"></ion-icon>
    <h2>{{'No statistics yet' | translate}}</h2>
    <p>{{'Best laps and records per track will appear here.' | translate}}</p>
  </div>
</ion-content>
