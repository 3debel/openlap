<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/garage" [text]="'Garage' | translate"></ion-back-button>
    </ion-buttons>
    <ion-title>{{'Track parts' | translate}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{'Track parts' | translate}}</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="section-label">{{'Series' | translate}}</div>
  <ion-list [inset]="true">
    <ion-item *ngFor="let row of rows | async" button [detail]="true" [routerLink]="row.series.id">
      <ion-label>
        <h2>{{row.series.name}}</h2>
        <p *ngIf="row.pieces > 0">
          {{ 'parts_summary' | translate: { pieces: row.pieces, types: row.types } }}
        </p>
        <p *ngIf="row.pieces === 0">{{'No parts entered yet' | translate}}</p>
      </ion-label>
      <span slot="end" class="check" role="img"
            [attr.aria-label]="(row.pieces > 0 ? 'Parts entered' : 'No parts entered yet') | translate">
        <ion-icon [name]="row.pieces > 0 ? 'checkmark-circle' : 'ellipse-outline'"
                  [color]="row.pieces > 0 ? 'success' : 'medium'" aria-hidden="true"></ion-icon>
      </span>
    </ion-item>
  </ion-list>

  <p class="footnote">
    {{'series_indicator_hint' | translate}}
  </p>
</ion-content>
